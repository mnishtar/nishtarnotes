# Builds and publishes nishtarnotes.com.
# Runs when anything is saved to the repo (a new Note from Eden, a file you add),
# every 3 hours (to pick up new Substack posts), or by hand from the Actions tab.
name: Publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Import new Substack posts (1-3-1 issues and Articles)
        run: python3 scripts/import_substack.py

      - name: Save imported posts to the repo
        run: |
          if [ -n "$(git status --porcelain content)" ]; then
            git config user.name "nishtar-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content
            git commit -m "Import from Substack"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build the site
        run: python3 build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
